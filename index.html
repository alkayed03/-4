<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luca Café &amp; Restaurant</title>
<style>
  :root {
    --bg:#0a0a0a;
    --card:#161616;
    --cream:#efe0c4;
    --cream-dark:#d9c49c;
    --line:rgba(239,224,196,.16);
    --text:#f6f1e7;
    --muted:rgba(246,241,231,.62);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); }
  body {
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex; justify-content:center;
    background:
      radial-gradient(520px 320px at 50% -60px, rgba(217,196,156,.20), transparent 70%),
      var(--bg);
  }
  .wrap { width:100%; max-width:460px; padding:48px 22px 44px; text-align:center; }

  .logo {
    width:176px; height:176px; margin:0 auto;
    border-radius:50%; overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 0 0 8px rgba(239,224,196,.07), 0 20px 44px rgba(0,0,0,.6);
    background:#000;
  }
  .logo img { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.06); }

  h1 {
    font-family:Georgia,"Times New Roman",serif;
    font-size:34px; font-weight:700; margin-top:26px; letter-spacing:.5px;
  }
  .tag {
    color:var(--cream-dark); font-size:13px; margin-top:8px;
    letter-spacing:.34em; text-transform:uppercase; direction:ltr;
  }
  .rule { width:54px; height:2px; background:var(--cream-dark); margin:22px auto 0; opacity:.7; border-radius:2px; }

  .links { display:flex; flex-direction:column; gap:12px; margin-top:28px; text-align:right; }
  a.btn {
    display:flex; align-items:center; gap:14px;
    padding:15px 18px; border-radius:16px;
    text-decoration:none; font-size:17px; font-weight:600;
    transition:transform .15s, filter .15s;
  }
  a.btn:active { transform:scale(.98); }
  a.btn:hover { filter:brightness(1.08); }
  a.btn .ic {
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex:none; font-weight:800;
  }
  a.btn small { display:block; font-size:13px; font-weight:400; margin-top:2px; opacity:.75; }

  a.primary { background:linear-gradient(135deg,#f3e6cb,#d9c49c); color:#14110b; box-shadow:0 10px 26px rgba(217,196,156,.18); }
  a.primary .ic { background:rgba(20,17,11,.12); }

  a.dark { background:var(--card); color:var(--text); border:1px solid var(--line); }
  a.dark .ic { background:rgba(239,224,196,.10); color:var(--cream); }
</style>
</head>
